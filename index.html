<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>서울 교통 대시보드</title>

  <style>
    * { box-sizing: border-box; } body { margin: 0; padding: 2.5vw; background: #10141d; color: #f3f6ff; font-family: sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; } h1 { font-size: clamp(40px, 5vw, 80px); margin: 0; } h2 { margin-top: 0; font-size: 28px; }
    button, input { font: inherit; padding: 12px 16px; border: 1px solid #52617c; border-radius: 8px; } button { cursor: pointer; background: #23334f; color: white; } button:focus-visible, input:focus-visible { outline: 3px solid #9ab9ff; } button:disabled { opacity: .6; }
    #memo, #refreshStatus { color: #aab8d0; margin: 16px 0; } .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 32px; } article, #settings { padding: 28px; border: 1px solid #2c3c55; border-radius: 16px; background: #172131; } .arrival { border-top: 1px solid #33425b; padding: 18px 0; } .arrival strong { font-size: 24px; } .arrival p { font-size: 24px; color: #a7d6ff; margin: 10px 0; } .arrival small, .meta { color: #aab8d0; } .error { color: #ffc5a8; line-height: 1.6; } form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 14px; } #settings input { padding: 9px 10px; } #settings button { padding: 9px 12px; } #settings h2 { font-size: 18px; margin-bottom: 14px; } #settings p { margin: 6px 0 0; } label { display: grid; gap: 8px; } input { background: #0e1726; color: white; min-width: 0; width: 100%; } .full { grid-column: 1 / -1; line-height: 1.7; } #settings { margin: 12px 0 12px auto; max-width: 640px; padding: 18px; border-radius: 10px; } .settings-head { display: flex; justify-content: space-between; align-items: center; } .settings-head button { margin-bottom: 12px; } #emptyState { color: #aab8d0; } .panels:empty { display: none; } [hidden] { display: none !important; } footer { margin-top: 28px; display: flex; gap: 14px; align-items: center; color: #aab8d0; } #testBtn { font-size: 20px; }
    /* 세로 뷰포트에서는 1080px 이상이어도 카드를 한 열로 배치합니다. */
    article { min-width: 0; overflow-wrap: anywhere; }
    .arrival { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 20px; align-items: baseline; }
    .arrival p { text-align: right; }
    .arrival small { grid-column: 1 / -1; }
    #saveStatus:empty { display: none; }
    @media (orientation: portrait) {
      body { padding: 4vw; }
      header { flex-direction: column; align-items: stretch; gap: 12px; }
      header h1 { font-size: clamp(48px, 10vw, 112px); text-align: center; font-variant-numeric: tabular-nums; }
      header > div { display: flex; justify-content: flex-end; gap: 10px; }
      #memo { text-align: center; font-size: clamp(16px, 2.5vw, 26px); }
      #refreshStatus { font-size: clamp(14px, 1.8vw, 20px); }
      .panels { grid-template-columns: minmax(0, 1fr); gap: 20px; margin-top: 20px; }
      article { padding: clamp(20px, 3vw, 32px); }
      article h2 { font-size: clamp(24px, 3.5vw, 38px); margin-bottom: 12px; }
      .arrival { padding: 16px 0; }
      .arrival strong, .arrival p { font-size: clamp(21px, 3vw, 32px); }
      .arrival small { font-size: clamp(15px, 2.2vw, 23px); }
      article > .meta { font-size: clamp(14px, 1.9vw, 20px); }
      #settings { width: 100%; }
      footer { flex-wrap: wrap; font-size: 14px; }
    }
    @media(max-width: 750px) { .panels, form { grid-template-columns: 1fr; } header { flex-wrap: wrap; } body { padding: 20px; } }
    @media(max-width: 420px) {
      .arrival { grid-template-columns: minmax(0, 1fr); gap: 0; }
      .arrival p { text-align: left; }
    }
  </style>
</head>

<body>
  <header><h1 id="clock">Loading...</h1><div><button id="refreshBtn" type="button">지금 갱신</button> <button id="settingsBtn" type="button" aria-expanded="false" aria-controls="settings">설정</button></div></header>
  <div id="memo">메모 불러오는 중...</div>
  <section id="settings" hidden>
    <div class="settings-head"><h2>교통정보 설정</h2><button id="closeSettingsBtn" type="button" aria-label="설정 닫기">닫기</button></div>
    <form id="settingsForm">
      <label>지하철 인증키<input id="subwayKey" type="password" autocomplete="off"></label>
      <label>지하철 · 역명/호선/방향<input id="station" placeholder="노들/9/공항방향" maxlength="500"></label>
      <label>버스 인증키 (Decoding)<input id="busKey" type="password" autocomplete="off"></label>
      <label>버스 · 정류소/노선<input id="arsId" placeholder="20276/동작08, 20014/360" maxlength="100"></label>
      <label>갱신 간격 (초, 최소 30)<input id="interval" type="number" min="30" max="3600" value="60" required></label>
      <div class="full meta">여러 조건은 쉼표로 구분합니다. 호선·방향·노선을 생략하면 전체 조회합니다. 키는 이 브라우저에 저장합니다.</div>
      <div class="full"><button type="submit">저장하고 닫기</button> <button id="presetBtn" type="button">내 조회조건 채우기</button> <button id="clearBtn" type="button">저장 정보 삭제</button></div>
    </form>
  </section>
  <p id="refreshStatus" role="status">설정에서 키와 조회할 역·정류소를 입력하세요.</p>
  <p id="saveStatus" role="status"></p>
  <p id="emptyState">설정에서 키와 조회할 역·정류소를 추가하세요. 여러 곳은 쉼표로 구분합니다.</p>
  <main class="panels" id="arrivalPanels"></main>
  <footer><span>카운터</span><button id="testBtn" type="button">5</button><span>서버 없이 브라우저에서 직접 조회</span></footer>
  <script src="browser-api.js"></script>
  <script src="script.js"></script>
</body>
</html>
