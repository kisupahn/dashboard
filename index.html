<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>서울 교통 대시보드</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --text-scale: 1.35; --page: #ffffff; --ink: #1a1c20; --card: #ffffff; --edge: #dedfe3; --muted: #757982; --control: #f5f5f6; --error: #a83832; }
    * { box-sizing: border-box; }
    body { margin: 0 auto; padding: clamp(18px, 3vw, 40px); max-width: 1200px; background: var(--page); color: var(--ink); font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
    header { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 28px; }
    header > div { margin-left: auto; }
    h1 { flex: 1 0 100%; font-size: calc(clamp(48px, 11vw, 148px) * var(--text-scale)); font-weight: 500; line-height: 1.2; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.045em; margin: 0; }
    h2 { margin: 0; font-size: calc(clamp(25px, 3.5vw, 40px) * var(--text-scale)); letter-spacing: -.04em; line-height: 1.35; word-break: keep-all; }
    button, input { font: inherit; border: 1px solid var(--edge); border-radius: 8px; padding: 10px 14px; }
    button { cursor: pointer; background: var(--control); color: var(--ink); } button:disabled { opacity: .45; }
    button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--muted); outline-offset: 3px; }
    .panels { width: 72%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
    article { position: relative; min-width: 0; padding: clamp(20px, 3vw, 32px); background: var(--card); border: 1px solid var(--edge); border-radius: 16px; }
    .card-head { padding-right: 60px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .card-head h2 { flex: 1 1 140px; min-width: 0; }
    .transport-icon { width: 38px; height: 38px; color: var(--ink); flex: 0 0 38px; }
    .transport-icon svg { width: 100%; height: 100%; display: block; }
    .date { flex-basis: 100%; margin: -8px 0 0; color: var(--muted); font-size: calc(clamp(16px, 2.1vw, 24px) * var(--text-scale)); }
    .stop-editor { position: relative; margin: 12px 0; padding: 14px; border: 1px solid var(--edge); border-radius: 10px; display: block; }
    .stop-editor legend { font-weight: 600; padding: 0 6px; }
    .stop-actions { margin-bottom: 10px; display: flex; justify-content: flex-end; gap: 6px; }
    .stop-actions button { padding: 5px 10px; }
    .stop-fields { display: grid; grid-template-columns: 64px minmax(0, 1fr) minmax(0, 1.5fr); gap: 8px; align-items: center; }
    .stop-fields label { min-width: 0; } .stop-fields input { padding: 10px 8px; }
    .type-toggle { align-self: stretch; padding: 8px 4px; white-space: nowrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .loading { position: absolute; top: 24px; right: 18px; margin: 0; color: var(--muted); font-size: 12px; }
    .arrivals { margin-top: 18px; }
    .route-row { display: grid; grid-template-columns: minmax(0, .95fr) repeat(2, minmax(0, 1fr)); align-items: center; padding: 14px 0; gap: 10px; }
    .route-name { justify-self: start; display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px; max-width: 100%; margin: 0; padding: 6px 10px; border: 1px solid var(--edge); border-radius: 9px; color: var(--ink); font-size: calc(clamp(16px, 2.2vw, 24px) * var(--text-scale)); font-weight: 600; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere; }
    .route-name.village, .route-name.local { color: #208047; }
    .route-name.trunk { color: #2863b5; }
    .route-name.line9 { color: #967d32; }
    .route-name.circular { color: #9b780c; }
    .route-name.express { color: #bc3c3c; }
    .destination { color: var(--muted); font-size: .72em; font-weight: 400; white-space: nowrap; }
    .route-error { grid-column: 1 / -1; margin: 4px 0 0; }
    .arrival { min-width: 0; min-height: 64px; padding: 0 8px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .arrival p { font-size: calc(clamp(19px, 3.4vw, 40px) * var(--text-scale)); font-weight: 600; line-height: 1.2; word-break: keep-all; font-variant-numeric: tabular-nums; letter-spacing: -1px; color: var(--ink); margin: 0; }
    .arrival small { color: var(--muted); font-size: calc(clamp(14px, 2vw, 22px) * var(--text-scale)); word-break: keep-all; line-height: 1.2; }
    .renew-notice { width: 72%; min-height: 200px; font-size: calc(32px * var(--text-scale)); background: var(--page); }
    .refresh-hint { width: 72%; text-align: center; color: var(--muted); font-size: calc(13px * var(--text-scale)); margin: 22px 0 0; }
    .error { color: var(--error); line-height: 1.5; font-size: 14px; }
    #settings { margin: 0 0 24px auto; max-width: 820px; padding: 18px; background: var(--card); border: 1px solid var(--edge); border-radius: 10px; }
    .settings-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; } #settings h2 { font-size: 18px; letter-spacing: 0; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 14px; } label { display: grid; gap: 8px; }
    input { min-width: 0; width: 100%; background: var(--page); color: var(--ink); padding: 9px 10px; }
    .token-control { display: flex; gap: 8px; } .token-control input { flex: 1; } .token-control button { flex-shrink: 0; }
    input:disabled { background: var(--control); color: var(--muted); }
    .news-toggle { display: flex; align-items: center; gap: 8px; } .news-toggle input { width: auto; }
    .dashboard-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; align-items: start; }
    .transit-column { min-width: 0; }
    .news-setting { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center; }
    .news-setting > label { min-width: 0; }
    .news-panel { width: 100%; min-width: 0; }
    .news-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .news-head a { color: var(--muted); font-size: 13px; }
    .news-player iframe { display: block; width: 100%; min-height: 200px; aspect-ratio: 16 / 9; border: 0; border-radius: 12px; background: #111; }
    .full { grid-column: 1 / -1; } details { color: var(--muted); font-size: 13px; } summary { cursor: pointer; padding: 7px 0; }
    pre { font: inherit; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
    #refreshStatus { font-size: 12px; color: var(--muted); } #saveStatus:empty { display: none; } #emptyState { color: var(--muted); }
    [hidden] { display: none !important; }
    @media (min-width: 1000px) and (orientation: landscape) {
      body { max-width: 1920px; }
      .dashboard-layout { grid-template-columns: minmax(0, .95fr) minmax(0, 1.25fr); gap: clamp(24px, 3vw, 48px); }
      .transit-column .panels, .transit-column .refresh-hint, .transit-column .renew-notice { width: 100%; }
      .news-panel { position: sticky; top: 24px; }
    }
    @media(max-width: 600px) { .panels, .refresh-hint, .renew-notice { width: 92%; } form { grid-template-columns: 1fr; } .stop-editor { padding: 10px; } .stop-fields { gap: 6px; } .route-name { padding: 5px 7px; } .arrival { padding: 0 4px; } }
  </style>
</head>

<body>
  <header><h1 id="clock">Loading...</h1><p id="date" class="date"></p><div><button id="refreshBtn" type="button">갱신</button> <button id="settingsBtn" type="button" aria-expanded="false" aria-controls="settings">설정</button></div></header>

  <section id="settings" hidden>
    <div class="settings-head"><h2>교통정보 설정</h2><button id="closeSettingsBtn" type="button" aria-label="설정 닫기">닫기</button></div>
    <form id="settingsForm">
      <details class="full"><summary>중계 주소 · 기본 설정됨</summary><label>Apps Script 웹 앱 주소<input id="relayUrl" type="url" autocomplete="off"></label></details>
      <div id="stopEditor" class="full"></div><button id="addStopBtn" type="button" class="full">정류장 추가</button>
      <div><label for="relayToken">중계 접속 코드</label><div class="token-control"><input id="relayToken" type="password" autocomplete="new-password" placeholder="미설정" disabled><button id="editTokenBtn" type="button" aria-expanded="false" aria-controls="relayToken">수정하기</button></div></div>
      <button id="fullscreenBtn" type="button">전체화면 전환</button>
      <label class="full">글자 크기 <output id="textScaleValue" for="textScale">135%</output><input id="textScale" type="range" min="100" max="180" step="5" value="135"></label>
      <label>갱신 간격 (초, 최소 30)<input id="interval" type="number" min="30" max="3600" value="60" required></label>
      <div class="full news-setting"><label class="news-toggle"><input id="newsEnabled" type="checkbox" checked>뉴스</label><label><span class="sr-only">뉴스 영상 · 라이브 주소</span><input id="newsUrl" type="url" autocomplete="off" placeholder="유튜브 영상 또는 라이브 공유 주소"></label></div>
      <details class="full"><summary>진단</summary><pre id="diagnostics"></pre><p id="refreshStatus"></p><small>자료: 서울특별시 · 화면 20261103.13</small></details>
      <div class="full"><button type="submit">저장하고 닫기</button> <button id="presetBtn" type="button">내 조회조건 채우기</button> <button id="clearBtn" type="button">저장 정보 삭제</button></div>
    </form>
  </section>

  <p id="saveStatus" role="status"></p>
  <div class="dashboard-layout">
  <section class="transit-column" aria-label="교통정보">
  <p id="emptyState">설정에서 조회할 곳을 추가하세요.</p>
  <main class="panels" id="arrivalPanels"></main>
  <button id="renewNotice" class="renew-notice" type="button" hidden>아무데나 눌러서 새로고침</button>
  <p id="refreshHint" class="refresh-hint" hidden>아무데나 눌러 새로고침</p>

  </section>
  <section id="newsPanel" class="news-panel" hidden aria-label="뉴스 재생">
    <div class="news-head"><h2>뉴스</h2><a id="newsLink" target="_blank" rel="noopener noreferrer">유튜브에서 열기</a></div>
    <div id="newsPlayer" class="news-player"></div>
  </section>

  </div>

  <script src="news-player.js?v=20261103.13"></script>
  <script src="route-catalog.js?v=20261103.13"></script>
  <script src="browser-api.js?v=20261103.13"></script>
  <script src="script.js?v=20261103.13"></script>
</body>
</html>
